function drawControls(){controls=[];if(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window){const s=scale;const add=(id,x,y,rad,label)=>{controls.push({id,sx:x*s,sy:y*s,rad:rad*s});ctx.fillStyle='#1e1a21a8';ctx.strokeStyle='#d8c4a766';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.arc(x*s,y*s,rad*s,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#e6d7bf';ctx.font='700 '+(10*s)+'px "DM Sans"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x*s,y*s)};const H=h/s,W=w/s;add('move',73,H-72,37,'◀ ▶');add('attack',W-63,H-73,31,'SLASH');add('jump',W-142,H-73,31,'JUMP');add('dash',W-221,H-73,28,'DASH');ctx.textAlign='left';ctx.textBaseline='alphabetic'}}
function drawKeyboardGuide(){ctx.save();ctx.textAlign='center';ctx.fillStyle='#08080b88';ctx.fillRect(w*.18,h-34,w*.64,25);ctx.font='600 '+Math.max(9,10*scale)+'px "DM Sans",sans-serif';ctx.letterSpacing='1px';ctx.fillStyle='#c6b4a3';ctx.fillText('MOVE  A / D OR ← / →     JUMP  SPACE / ↑     DASH  SHIFT / X     ATTACK  J / Z',w/2,h-17);ctx.restore()}
function overlay(title,sub,detail,button){ctx.fillStyle='#07070bd9';ctx.fillRect(0,0,w,h);const g=ctx.createLinearGradient(0,h*.23,0,h*.78);g.addColorStop(0,'transparent');g.addColorStop(.2,'#17131aec');g.addColorStop(.8,'#17131aec');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(w*.12,h*.2,w*.76,h*.62);ctx.textAlign='center';ctx.fillStyle='#dc9876';ctx.font='600 '+Math.max(11,13*scale)+'px "DM Sans"';ctx.letterSpacing='4px';ctx.fillText('A TOWER THAT REMEMBERS',w/2,h*.34);ctx.letterSpacing='0';ctx.fillStyle='#eee0cc';ctx.font='600 '+Math.max(31,55*scale)+'px "Cinzel",Georgia,serif';ctx.fillText(title,w/2,h*.47);ctx.fillStyle='#bcada0';ctx.font=Math.max(13,16*scale)+'px "DM Sans"';ctx.fillText(sub,w/2,h*.55);ctx.fillStyle='#8f827b';ctx.font=Math.max(11,13*scale)+'px "DM Sans"';ctx.fillText(detail,w/2,h*.61);ctx.fillStyle='#e7c59a';ctx.font='700 '+Math.max(12,14*scale)+'px "DM Sans"';ctx.letterSpacing='2px';ctx.fillText(button,w/2,h*.69);ctx.letterSpacing='0';ctx.textAlign='left'}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);drawBackground();ctx.save();if(shake>0)ctx.translate((rand()-.5)*shake*scale,(rand()-.5)*shake*scale);for(const p of platforms)drawPlatform(p);for(const e of enemies)drawEnemy(e);drawPlayer();for(const q of particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.color;ctx.shadowColor=q.color;ctx.shadowBlur=9*scale;ctx.beginPath();ctx.arc(q.x*scale,screenY(q.y),q.size*scale,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();drawHud();drawControls();if(matchMedia('(pointer:fine)').matches)drawKeyboardGuide();if(screenFlash){ctx.fillStyle='#e8876b'+Math.floor(screenFlash*180).toString(16).padStart(2,'0');ctx.fillRect(0,0,w,h)}if(state==='title')overlay('ASHENVEIL','The tower changes every time you climb.','Move A / D  ·  Jump SPACE  ·  Dash SHIFT  ·  Strike J','TAP OR PRESS ENTER TO BEGIN');if(state==='over')overlay('THE FALL','You climbed '+Math.floor(climb)+' metres.','The tower has already begun to rearrange itself.','TAP OR PRESS ENTER TO CLIMB AGAIN');if(state==='pause')overlay('PAUSED','The tower waits in the dark.','Press Escape to continue.','TAP OR PRESS ESCAPE')}
function frame(now){const dt=Math.min(.034,(now-last)/1000||0);last=now;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
