<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Ashenveil</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#05060d">
<style>
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Georgia,'Times New Roman',serif;color:#f3dcb0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 0 10px #000}
#hud b{font-size:30px;font-weight:normal;letter-spacing:1px}
#hud small{display:block;font-size:13px;opacity:.65;margin-top:2px}
.b{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:70px;height:70px;border-radius:50%;background:rgba(243,220,176,.08);border:1.5px solid rgba(243,220,176,.3);color:#f3dcb0;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(3px)}
.b.on{background:rgba(255,190,90,.35);border-color:#ffc56b}
#zl{position:fixed;left:0;top:0;bottom:0;width:48%;touch-action:none}
#sb{position:fixed;left:calc(env(safe-area-inset-left,0px) + 34px);bottom:30px;width:110px;height:110px;border-radius:50%;border:2px solid rgba(243,220,176,.25);background:rgba(243,220,176,.05);pointer-events:none;opacity:.55}
#sk{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:rgba(243,220,176,.28);border:1.5px solid rgba(243,220,176,.5)}
#bj{right:calc(env(safe-area-inset-right,0px) + 18px);width:80px;height:80px}#bd{right:calc(env(safe-area-inset-right,0px) + 44px);bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}#ba{right:calc(env(safe-area-inset-right,0px) + 108px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:76px;height:76px}
#mu,#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);width:40px;height:40px;border-radius:50%;background:rgba(243,220,176,.08);border:1.5px solid rgba(243,220,176,.3);display:flex;align-items:center;justify-content:center;font-size:17px;z-index:6;touch-action:none;backdrop-filter:blur(5px);color:#f3dcb0}
#mu{right:calc(env(safe-area-inset-right,0px) + 14px)}
#pauseBtn{display:none;right:calc(env(safe-area-inset-right,0px) + 62px);cursor:pointer}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#05060d;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px;line-height:1.6}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(3,4,10,.2),rgba(3,4,10,.62) 45%,rgba(3,4,10,.82));text-align:center;padding:24px;transition:opacity .4s;z-index:4;box-sizing:border-box}
.menuCard{position:relative;width:min(430px,92vw);padding:34px 32px 25px;box-sizing:border-box;border:1px solid rgba(237,203,150,.34);background:linear-gradient(145deg,rgba(15,16,31,.92),rgba(5,7,16,.9));box-shadow:0 22px 80px #000b,inset 0 0 38px #b17b2810;backdrop-filter:blur(12px)}
.menuCard:before,.menuCard:after{content:"";position:absolute;width:26px;height:26px;border-color:#e5b978}
.menuCard:before{top:8px;left:8px;border-top:1px solid;border-left:1px solid}.menuCard:after{right:8px;bottom:8px;border-right:1px solid;border-bottom:1px solid}
.sig{font:10px Georgia;letter-spacing:5px;color:#c89b67;text-transform:uppercase;margin-bottom:13px}
#ov h1{font-size:clamp(42px,10vw,66px);font-weight:normal;letter-spacing:7px;line-height:1;margin:0;color:#ffe0a5;text-shadow:0 0 28px #ff9a3c80}
.tagline{font:11px Georgia;letter-spacing:4px;color:#c3b9d3;margin:12px 0 22px;text-transform:uppercase}
.rule{width:100%;height:1px;background:linear-gradient(90deg,transparent,#c59b65aa,transparent);margin:16px 0}
#t1{font:italic 15px Georgia;color:#e6d8c4;line-height:1.7;margin:12px auto 20px;max-width:310px}
#t2{font:12px Georgia;color:#b9b6c1;line-height:1.8;margin:0 auto;max-width:330px;min-height:52px;max-height:30vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.menuActions{display:grid;gap:9px;margin-top:22px}
.menuBtn{height:43px;border:1px solid #b58e61;background:linear-gradient(90deg,#8e593b,#bd8953,#8e593b);color:#fff0d1;font:12px Georgia;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.menuBtn.secondary{background:rgba(243,220,176,.035);border-color:#c4b7a244;color:#d4c9b5}
.menuBtn:active{filter:brightness(1.4);transform:scale(.985)}
.menuFoot{font:9px Georgia;color:#898595;letter-spacing:2px;margin-top:17px;text-transform:uppercase}
#ov .go{margin-top:18px;font:11px Georgia;letter-spacing:2px;color:#f0c783;animation:p 1.8s infinite}
@keyframes p{50%{opacity:.35}}
@media (hover:hover) and (pointer:fine){.b,#zl,#sb{display:none!important}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-width:560px){#ov{padding:14px;background:rgba(3,4,10,.62)}.menuCard{padding:27px 22px 20px}.menuActions{gap:7px}.menuBtn{height:40px}}
@media (max-height:500px) and (orientation:landscape){
 #ov{align-items:flex-start;overflow-y:auto;padding:5px 10px}
 .menuCard{margin:auto;padding:10px 20px 8px}
 .sig{margin:0 0 4px;font-size:8px}
 .menuCard h1{font-size:35px;letter-spacing:5px}
 .tagline{margin:3px 0 8px;font-size:8px}
 .rule{margin:6px 0}
 #t1{font-size:12px;line-height:1.25;margin:4px auto 6px}
 #t2{font-size:10px;line-height:1.3;min-height:0;max-height:26vh}
 .menuActions{grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
 .menuBtn{height:31px;font-size:9px;letter-spacing:1.5px}
 .menuFoot{margin-top:6px;font-size:7px}
 #ov .go{margin-top:6px;font-size:8px}
}
@media (prefers-reduced-motion:reduce){#ov .go{animation:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><b id="h">0 m</b><small id="bs"></small></div>
<div id="zl"></div><div id="sb"><div id="sk"></div></div>
<div class="b" id="bd">dash</div><div class="b" id="ba">strike</div><div class="b" id="bj">jump</div>
<div id="mu" role="button" aria-label="Toggle sound" title="Toggle sound">&#128266;</div><button id="pauseBtn" aria-label="Pause game" title="Pause (Esc)">Ⅱ</button>
<div id="rot">Rotate your phone to landscape<br>to play Ashenveil</div>
<div id="ov"><section class="menuCard"><div class="sig">ENDLESS 2D CLIMBER</div><h1>ASHENVEIL</h1><div class="tagline">VERTICAL ACTION</div><div class="rule"></div>
<p id="t1">Climb. Fight. Keep rising.</p>
<p id="t2">Move, jump, strike, and pogo through a new route every run.</p>
<div class="menuActions"><button class="menuBtn" id="startBtn">Begin the climb</button><button class="menuBtn secondary" id="loreBtn">Best height</button><button class="menuBtn secondary" id="controlsBtn">How to play</button><button class="menuBtn secondary" id="optionsBtn">Options</button></div>
<div class="menuFoot">Procedural ascent • every run creates a new route</div><div class="go" id="menuHint">ENTER / TAP TO BEGIN</div></section></div>
<script>
// ---------- tuning ----------
const T={run:215,accG:7000,accA:3400,grav:1750,jump:705,cut:.3,dash:720,dashT:.14,fall:900,slide:50,wjx:300,wjy:705,coyote:.12,buffer:.13,wallCoyote:.12,lock:.12};
let W=360;const WALL=16;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let sc,Hv;
function rs(){const d=Math.min(devicePixelRatio||1,2.5);cv.width=innerWidth*d;cv.height=innerHeight*d;sc=cv.height/360;Hv=360;W=cv.width/sc}
addEventListener('resize',rs);rs();
// ---------- input ----------
const K={l:0,r:0,j:0,d:0,u:0};let jBuf=0,dBuf=0,aBuf=0;
function bind(id,fn){const e=document.getElementById(id);const f=v=>ev=>{ev.preventDefault();ev.stopPropagation();fn(v);e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',f(1));['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,f(0)))}
const zl=document.getElementById('zl'),sb=document.getElementById('sb'),sk=document.getElementById('sk');let sid=null,ax=0,ay=0;
function sbPlace(){sb.style.left=ax-55+'px';sb.style.top=ay-55+'px';sb.style.bottom='auto'}
function mv(e){let dx=e.clientX-ax,dy=e.clientY-ay;const d=Math.hypot(dx,dy),m=42;if(d>m){dx*=m/d;dy*=m/d}sk.style.transform=`translate(${dx}px,${dy}px)`;K.l=dx<-12?1:0;K.r=dx>12?1:0;K.d=dy>24?1:0;K.u=dy<-24?1:0}
zl.addEventListener('pointerdown',e=>{if(sid!==null)return;e.preventDefault();sid=e.pointerId;try{zl.setPointerCapture(sid)}catch(_){}ax=e.clientX;ay=e.clientY;sbPlace();sb.style.opacity=1;mv(e)});
zl.addEventListener('pointermove',e=>{if(e.pointerId===sid)mv(e)});
const sEnd=e=>{if(e.pointerId!==sid)return;sid=null;K.l=K.r=K.d=K.u=0;sb.style.cssText='';sk.style.transform=''};
zl.addEventListener('pointerup',sEnd);zl.addEventListener('pointercancel',sEnd);bind('bj',v=>{K.j=v;if(v)jBuf=T.buffer});bind('bd',v=>{if(v)dBuf=T.buffer});bind('ba',v=>{if(v)aBuf=T.buffer});
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyZ:'j',KeyW:'j',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{const gameKey=!!km[e.code]||e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyC'||e.code==='KeyK'||e.code==='KeyJ';if(e.code==='Space'||(state==='play'&&gameKey))e.preventDefault();if(e.repeat)return;if(state==='play'){const k=km[e.code];if(k){K[k]=1;if(k==='j')jBuf=T.buffer}if(e.code==='ArrowUp'||e.code==='KeyW')K.u=1;if(e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight')dBuf=T.buffer;if(e.code==='KeyC'||e.code==='KeyK'||e.code==='KeyJ')aBuf=T.buffer}if(e.code==='Escape'){if(state==='play')pauseGame();else if(state==='paused')resumeGame();e.preventDefault();return}if(e.code==='Enter'&&state!=='play'&&state!=='paused')begin()});
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault();const k=km[e.code];if(k)K[k]=0;if(e.code=='ArrowUp'||e.code=='KeyW')K.u=0});
// ---------- state ----------
let P,plats,cam,last,parts,ghosts,state='menu',best=0,bestPx=0,maxH=0,shake=0,time=0,deadAt=0;
try{best=+localStorage.getItem('es_best')||0}catch(e){}
let screenShake=true,vibrationOn=true;
try{screenShake=localStorage.getItem('es_shake')!=='0';vibrationOn=localStorage.getItem('es_vibe')!=='0'}catch(e){}

const stars=[...Array(70)].map(()=>({x:Math.random()*1000,y:Math.random()*1200,r:Math.random()*1.2+.3,p:Math.random()*6}));
const pillars=[...Array(7)].map((_,i)=>({x:i*62-10+Math.random()*20,w:20+Math.random()*26,f:.25+Math.random()*.2}));
const bnd=y=>{const h=-y,c=180+130*Math.sin(h*.003)+30*Math.sin(h*.0075+1.3),w=240+30*Math.sin(h*.004+2);return[c-w,c+w]};
const wb=(y,h)=>{const a=bnd(y+h*.5);return[a[0],a[1]]};
let camX=0,last2=null,wsp=[],E=[],B=[],fx=[],hs=0,arena=null,ga=null,nextGate=-1000,level=0,bn='',bnT=0;
function reset(){
 const b0=bnd(0),c0=(b0[0]+b0[1])/2;
 P={x:c0-9,y:-28,w:18,h:28,vx:0,vy:0,face:1,gr:false,coy:0,wcoy:0,wd:0,wall:0,dash:0,dcd:0,can:true,lock:0,jmp:false,sx:1,sy:1,swing:0,hp:5,inv:0,sw:0,at:0,ac:0,cmb:0,cmbT:0,pg:0,dn:false};
 plats=[{x:b0[0],y:0,w:b0[1]-b0[0],h:16,s:1,z:0}];plats[0].img=platSprite(plats[0]);last={cx:c0,y:0,w:40};last2=null;wsp=[];parts=[];ghosts=[];maxH=0;E=[];B=[];fx=[];hs=0;arena=null;ga=null;nextGate=-1e12;level=0;bn='';bnT=0;
 cam=-28-Hv*.6;camX=P.x+9-W/2;bestPx=best*10;gen();
}
function gen(){while(last.y>cam-700){
 const hd=-last.y,hard=Math.min(1,hd/6000);
 const y=last.y-(66+Math.random()*(30+hard*10)),bb=bnd(y),L=bb[0],R=bb[1];
 if(!ga&&last.y<=nextGate){const d=doorMk(last.y-72);arena={yb:d.y,yt:d.y-400,st:0,wave:0,waves:2+Math.min(3,level),top:null,bot:d,cd:0};ga={yt:arena.yt};last={cx:last.cx,y:d.y,w:40};continue}
 if(ga&&y<ga.yt+30){const d=doorMk(ga.yt);arena.top=d;last={cx:last.cx,y:ga.yt,w:40};nextGate=ga.yt-900;ga=null;continue}
 const far=Math.random()<.2+hard*.15,sp=hd>500&&Math.random()<.2+hard*.25;
 const w=sp?130+Math.random()*25:105+Math.random()*(50-hard*10);
 let cx=0,ok=false;
 for(let i=0;i<16&&!ok;i++){
  cx=last.cx+(Math.random()<.5?-1:1)*((last.w+w)/2+26+Math.random()*(far?150:95));
  ok=cx-w/2>=L+10&&cx+w/2<=R-10&&(!last2||cx+w/2<last2.cx-last2.w/2-14||cx-w/2>last2.cx+last2.w/2+14);
 }
 if(!ok)cx=Math.max(L+w/2+10,Math.min(R-w/2-10,last.cx+(last.cx>(L+R)/2?-1:1)*((last.w+w)/2+30)));
 if(hd>800&&Math.random()<.16+hard*.2){const m=(last.y+y)/2;wsp.push({y0:m-22,y1:m+22,side:Math.random()<.5?-1:1})}
 {const o={x:cx-w/2,y,w,h:12,s:Math.random(),sp:sp?{o:Math.random()<.5?6:w-40,w:34}:null,z:hd<1200?0:hd<3000?1:2};o.img=platSprite(o);plats.push(o);if(!sp&&hd>250&&Math.random()<Math.min(.55,.12+hard*.55)){const pool=['wisp','crawler'];if(hd>600)pool.push('archer');if(hd>1400&&w>=120)pool.push('brute');const n=1+(hd>1500&&Math.random()<.45?1:0)+(hd>3500&&Math.random()<.45?1:0);for(let k=0;k<n;k++)spawnE(pool[Math.random()*pool.length|0],o)}}
 {const lr=last.cx+last.w/2,ll=last.cx-last.w/2,ge=cx>last.cx?cx-w/2-lr:ll-(cx+w/2);
  if(ge>=44&&Math.random()<.6)plats.push({x:(cx>last.cx?lr+ge/2:cx+w/2+ge/2)-5,y:y-8,w:10,h:last.y-y+12,pole:1,s:0,z:hd<1200?0:hd<3000?1:2})}
 last2=last;last={cx,y,w};
}}
function clampX(){const q=wb(P.y,P.h);if(P.x<q[0]){P.x=q[0];if(P.vx<0)P.vx=0}if(P.x+P.w>q[1]){P.x=q[1]-P.w;if(P.vx>0)P.vx=0}
 for(const p of plats)if(P.y+P.h>p.y+4&&P.y<p.y+p.h-2&&P.x+P.w>p.x&&P.x<p.x+p.w){if(P.x+P.w/2<p.x+p.w/2){P.x=p.x-P.w;if(P.vx>0)P.vx=0}else{P.x=p.x+p.w;if(P.vx<0)P.vx=0}}}
function hurt(){const x0=P.x+3,x1=P.x+P.w-3,y0=P.y+5,y1=P.y+P.h-1;
 for(const p of plats)if(p.sp&&p.y>y0-20&&p.y<y1+12){const a=p.x+p.sp.o+2,b=p.x+p.sp.o+p.sp.w-2;if(x1>a&&x0<b&&y1>p.y-12&&y0<p.y)return true}
 const q=wb(P.y,P.h);
 for(const k of wsp)if(k.y0<y1&&k.y1>y0){if(k.side<0&&P.x<q[0]+13)return true;if(k.side>0&&P.x+P.w>q[1]-13)return true}
 return false}
function burst(x,y,n,c,sp,up){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(up||0),l:.4+Math.random()*.5,m:.9,c})}}
function begin(){audioInit();if(AC&&AC.state=='suspended')AC.resume();if(state=='play')return;if(state=='dead'&&performance.now()-deadAt<700)return;reset();K.l=K.r=K.j=K.d=K.u=0;jBuf=dBuf=aBuf=0;state='play';document.getElementById('startBtn').disabled=true;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();document.getElementById('pauseBtn').style.display='flex';document.getElementById('ov').style.display='none';document.getElementById('ov').style.opacity=0;document.getElementById('ov').style.pointerEvents='none'}
function pauseGame(){
 if(state!=='play')return;state='paused';menuOverlay.style.display='flex';menuOverlay.style.opacity=1;menuOverlay.style.pointerEvents='auto';showPause();
}
function resumeGame(){
 if(state!=='paused')return;state='play';document.getElementById('startBtn').disabled=true;document.querySelector('.menuCard h1').textContent='ASHENVEIL';menuOverlay.style.display='none';menuOverlay.style.opacity=0;menuOverlay.style.pointerEvents='none';
 document.getElementById('pauseBtn').style.display='flex';bindRecord();bindControls();bindOptions();
}
const menuOverlay=document.getElementById('ov');
function bindRecord(){
 const b=document.getElementById('loreBtn');b.textContent='Best height';
 b.onclick=()=>setPage(best?'Personal record · '+best+' m':'No climb recorded yet','Reach a new height to set your record. Your best height is saved on this device.');
}
function bindControls(){
 const b=document.getElementById('controlsBtn');b.textContent='How to Play';
 b.onclick=()=>setPage('Move with intention. Strike to survive.','PC: A / D or ← / → move • Space / W / ↑ jump • J / C / K strike • X / Shift dash • S / ↓ for an aerial downward strike • Esc pauses. Strike toward your facing; hold Up to strike overhead. Down-strike an enemy or spike while airborne to pogo back up. Enemies telegraph their attacks—dash through danger. Touch: left side moves; action buttons on the right.');
}
function bindOptions(){const b=document.getElementById('optionsBtn');b.textContent='Options';b.onclick=showOptions}
function savePrefs(){try{localStorage.setItem('es_mute',muted?'1':'0');localStorage.setItem('es_shake',screenShake?'1':'0');localStorage.setItem('es_vibe',vibrationOn?'1':'0')}catch(e){}}
function syncSoundIcon(){document.getElementById('mu').innerHTML=muted?'&#128263;':'&#128266;'}
function toggleSound(){muted=!muted;savePrefs();syncSoundIcon();if(mg)mg.gain.value=muted?0:.55;if(document.querySelector('.menuCard h1').textContent==='OPTIONS')updateOptionsPage()}
function updateOptionsPage(){
 document.getElementById('t2').textContent='Sound and music are '+(muted?'off':'on')+'. Screen shake is '+(screenShake?'on':'off')+'. Touch vibration is '+(vibrationOn?'on':'off')+'. These choices are saved on this device.';
 document.getElementById('loreBtn').textContent='Sound: '+(muted?'Off':'On');
 document.getElementById('controlsBtn').textContent='Screen shake: '+(screenShake?'On':'Off');
 document.getElementById('optionsBtn').textContent='Touch vibration: '+(vibrationOn?'On':'Off');
}
function showOptions(){
 document.querySelector('.menuCard h1').textContent='OPTIONS';
 document.getElementById('t1').textContent='Make the climb your own.';
 document.getElementById('startBtn').textContent='Back';
 document.getElementById('startBtn').onclick=()=>state==='paused'?showPause():showHome();
 document.getElementById('loreBtn').onclick=toggleSound;
 document.getElementById('controlsBtn').onclick=()=>{screenShake=!screenShake;savePrefs();updateOptionsPage()};
 document.getElementById('optionsBtn').onclick=()=>{vibrationOn=!vibrationOn;savePrefs();updateOptionsPage()};
 document.getElementById('menuHint').textContent='ASHENVEIL • OPTIONS SAVED ON THIS DEVICE';
 updateOptionsPage();
}
function showHome(){
 document.getElementById('ov').style.display='flex';document.getElementById('startBtn').disabled=false;document.querySelector('.menuCard h1').textContent='ASHENVEIL';
 document.getElementById('t1').textContent='Climb. Fight. Keep rising.';
 document.getElementById('t2').textContent='Move, jump, strike, and pogo through a new route every run.';
 document.getElementById('startBtn').textContent='Begin the climb';document.getElementById('startBtn').onclick=begin;
 document.getElementById('menuHint').textContent='ENTER / TAP TO BEGIN';bindRecord();bindControls();bindOptions();
}
function showPause(){
 document.getElementById('startBtn').disabled=false;document.querySelector('.menuCard h1').textContent='PAUSED';bindControls();bindOptions();
 document.getElementById('t1').textContent='Take a breath.';
 document.getElementById('t2').textContent='Pause here. Your climb will be ready when you are.';
 document.getElementById('startBtn').textContent='Resume climb';document.getElementById('startBtn').onclick=resumeGame;
 const b=document.getElementById('loreBtn');b.textContent='Return to title';b.onclick=()=>{state='menu';document.getElementById('pauseBtn').style.display='none';showHome()};
 document.getElementById('menuHint').textContent='ESC / TAP TO RESUME';
}
function setPage(title,body,button='Back'){
 document.getElementById('t1').textContent=title;document.getElementById('t2').textContent=body;
 document.getElementById('startBtn').textContent=button;
 document.getElementById('startBtn').onclick=()=>state==='paused'?showPause():showHome();
 document.getElementById('menuHint').textContent='ASHENVEIL • THE HOLLOW ASCENT';
}
document.getElementById('startBtn').onclick=begin;
bindRecord();
bindControls();bindOptions();
menuOverlay.addEventListener('pointerdown',e=>{if(e.target===menuOverlay)begin()});
function die(){
 state='dead';document.getElementById('startBtn').disabled=false;deadAt=performance.now();sfx('hurt');shake=8;burst(P.x+9,P.y+14,40,'255,190,100',220,60);
 const nb=maxH>best;if(nb){best=Math.floor(maxH);try{localStorage.setItem('es_best',best)}catch(e){}}
